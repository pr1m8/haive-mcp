[tool.poetry]
name = "haive-mcp"
version = "1.0.0"
description = "Dynamic MCP integration for AI agents - search 1,960+ servers, install with HITL approval, connect via LangChain or Docker"
authors = ["pr1m8 <william.astley@algebraicwealth.com>"]
license = "MIT"
readme = "README.md"
homepage = "https://github.com/pr1m8/haive-mcp"
repository = "https://github.com/pr1m8/haive-mcp"
documentation = "https://haive-mcp.readthedocs.io"
keywords = ["mcp", "model-context-protocol", "ai-agents", "langchain", "tool-use"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Framework :: FastAPI",
    "Typing :: Typed",
]
packages = [{ include = "haive", from = "src" }]
exclude = ["data/**", "docs/**", "tests/**", "scripts/**", "project_docs/**", "examples/**", "configs/**"]

[tool.poetry.scripts]
haive-mcp = "haive.mcp.__main__:main"

[tool.poetry.dependencies]
python = ">=3.12,<3.13"
pydantic = "^2.10.6"
langchain = "^0.3.20"
langchain-core = "^0.3.44"
langgraph = "^0.3.5"
rich = "^14.1.0"
mcp = "^1.9.4"
fastmcp = "^2.8.0"
langchain-mcp-adapters = "^0.1.7"
click = "^8.2.1"
pyyaml = "^6.0.2"
aiohttp = "^3.9.5"
fastapi = "^0.115.0"
uvicorn = "^0.34.0"
langchain-mcp-tools = "^0.2.9"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.5"
black = "^25.1.0"
isort = "^6.0.1"
mypy = "^1.15.0"
pytest-sugar = "^1.0.0"
pytest-asyncio = "^0.26.0"
allure-pytest = "^2.14.2"
pytest-clarity = "^1.0.1"
pytest-html = "^4.1.1"


[tool.poetry.group.docs.dependencies]
sphinx = "^8.2.3"
sphinx-autoapi = "^3.6.0"
sphinx-autodoc-typehints = "^3.1.0"
autodoc-pydantic = "^2.0.1"
furo = "^2024.8.6"
myst-parser = "^4.0.1"
sphinx-copybutton = "^0.5.2"
sphinx-design = "^0.6.1"
sphinxcontrib-mermaid = "^1.0.0"
sphinx-codeautolink = "^0.17.0"
sphinxext-opengraph = "^0.10.0"
sphinx-sitemap = "^2.6.0"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

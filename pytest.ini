[tool:pytest]
# Test discovery
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Markers
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    integration: marks tests as integration tests
    requires_mcp: marks tests that require MCP to be installed
    unit: marks tests as unit tests

# Output
addopts = 
    --verbose
    --strict-markers
    --tb=short

# Async support
asyncio_mode = auto

# Coverage
[coverage:run]
source = src/haive/mcp
omit = 
    */tests/*
    */__pycache__/*
    */conftest.py

[coverage:report]
exclude_lines =
    pragma: no cover
    def __repr__
    raise AssertionError
    raise NotImplementedError
    if __name__ == .__main__.:
    if TYPE_CHECKING:
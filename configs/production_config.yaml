---
# Production MCP Configuration
# Optimized for production environments with stricter settings

# Inherit from default config
extends: default_config.yaml
# Production-specific settings
settings:
  # More restrictive installation directory
  install_dir: /opt/mcp/servers

  # Production logging
  log_level: WARNING
  log_file: /var/log/mcp/downloader.log
  log_max_size: 10485760 # 10MB
  log_backup_count: 5

  # Conservative download settings
  max_concurrent_downloads: 3
  connection_timeout: 60
  retry_attempts: 5
  retry_delay: 10

  # Strict health monitoring
  health_check_interval: 1800 # 30 minutes
  health_check_on_startup: true
  health_check_timeout: 30
  fail_on_health_check: true

  # No auto-updates in production
  auto_update: false

  # No auto-discovery
  auto_discover: false

  # Security settings
  verify_ssl: true
  allowed_registries:
    - https://registry.npmjs.org
    - https://pypi.org
    - https://github.com

  # Resource limits
  max_install_size: 1073741824 # 1GB
  max_memory_usage: 536870912 # 512MB
# Production servers only
servers:
  # Only enable stable, verified servers
  - name: filesystem
    template: npm_official
    source: npm
    variables:
      service: filesystem
    enabled: true
    tags: [file, official, core, production]
    # Add verification
    verify_command:
      - npx
      - -y
      - "@modelcontextprotocol/server-filesystem"
      - --version
  - name: sqlite
    template: npm_official
    source: npm
    variables:
      service: sqlite
    enabled: true
    tags: [database, official, embedded, production]
    verify_command:
      - npx
      - -y
      - "@modelcontextprotocol/server-sqlite"
      - --version
# Strict patterns
patterns:
  # Only official sources
  discovery_sources:
    - https://github.com/modelcontextprotocol/servers

  # Only verified patterns
  package_patterns:
    npm:
      - "@modelcontextprotocol/server-*"

  # Extensive exclusions
  exclude_patterns:
    - "*-test"
    - "*-demo"
    - "*-example"
    - "*-deprecated"
    - "*-beta"
    - "*-alpha"
    - "*-dev"
    - "*-experimental"

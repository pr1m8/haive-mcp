# Development MCP Configuration
# Relaxed settings for development and testing

# Inherit from default
extends: default_config.yaml

# Development settings
settings:
  # Local installation
  install_dir: ./dev_servers

  # Verbose logging
  log_level: DEBUG
  log_file: ./logs/dev_downloader.log
  log_to_console: true

  # Faster downloads
  max_concurrent_downloads: 10
  connection_timeout: 15
  retry_attempts: 2
  retry_delay: 2

  # Frequent health checks
  health_check_interval: 300 # 5 minutes
  health_check_on_startup: false

  # Enable auto-features
  auto_update: true
  auto_discover: true
  discovery_limit: 50

  # Development mode
  debug_mode: true
  verbose_errors: true
  save_debug_info: true

# Development servers - enable more for testing
servers:
  - name: filesystem
    template: npm_official
    source: npm
    variables:
      service: filesystem
    enabled: true
    tags: [file, official, core, dev]

  - name: github
    template: npm_official
    source: npm
    variables:
      service: github
    env:
      GITHUB_TOKEN: ${GITHUB_TOKEN}
    enabled: true
    tags: [git, official, vcs, dev]

  - name: sqlite
    template: npm_official
    source: npm
    variables:
      service: sqlite
    enabled: true
    tags: [database, official, embedded, dev]

  # Example custom servers for testing
  - name: test-npm-server
    template: npm_community
    source: npm
    variables:
      package: mcp-test-server
    enabled: true
    tags: [test, npm, dev]

  - name: test-git-server
    template: git_repo
    source: https://github.com/example/test-mcp.git
    variables:
      owner: example
      repo: test-mcp
    enabled: false # Enable when testing
    tags: [test, git, dev]

# Broader patterns for discovery
patterns:
  discovery_sources:
    - https://github.com/modelcontextprotocol/servers
    - https://registry.npmjs.org/-/v1/search?text=mcp
    - https://api.github.com/search/repositories?q=mcp+in:name
    - https://pypi.org/search/?q=mcp

  package_patterns:
    npm:
      - "*mcp*"
      - "mcp-*"
      - "*-mcp-*"
    pypi:
      - "*mcp*"
      - "mcp*"
    docker:
      - "*/mcp*"
      - "mcp/*"

  # Minimal exclusions for testing
  exclude_patterns:
    - "*-deprecated"
